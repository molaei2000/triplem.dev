<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#8e887d"/>
    </pattern>
  </defs>
  <rect x="120" y="90" width="960" height="450" fill="url(#dots)" opacity="0.4"/>

  <!-- request side: uncached window that reads the cookie -->
  <rect x="140" y="170" width="300" height="290" rx="10" fill="#fbf8f2" stroke="#57534b" stroke-width="2"/>
  <line x1="140" y1="208" x2="440" y2="208" stroke="#57534b" stroke-width="1.5"/>
  <circle cx="164" cy="189" r="5" stroke="#57534b" stroke-width="1.5"/>
  <circle cx="184" cy="189" r="5" stroke="#57534b" stroke-width="1.5"/>
  <rect x="170" y="240" width="140" height="8" rx="4" fill="#57534b"/>
  <rect x="170" y="270" width="220" height="8" rx="4" fill="#8e887d"/>
  <rect x="170" y="330" width="200" height="44" rx="8" stroke="#1b1a17" stroke-width="2.5"/>
  <circle cx="194" cy="352" r="9" stroke="#1b1a17" stroke-width="2.5"/>
  <rect x="214" y="347" width="130" height="10" rx="5" fill="#57534b"/>

  <!-- boundary of the cached scope -->
  <line x1="560" y1="110" x2="560" y2="520" stroke="#8e887d" stroke-width="2" stroke-dasharray="4 10"/>

  <!-- gold: the value passed as an argument -->
  <path d="M370 352 C 440 352, 480 352, 640 352" stroke="#8f6f2e" stroke-width="3.5"/>
  <path d="M626 340 L642 352 L626 364" stroke="#8f6f2e" stroke-width="3.5"/>
  <circle cx="500" cy="352" r="14" fill="#eae5da" stroke="#8f6f2e" stroke-width="4"/>

  <!-- cache store: stacked entries keyed by argument -->
  <rect x="650" y="170" width="420" height="290" rx="10" fill="#fbf8f2" stroke="#1b1a17" stroke-width="3"/>
  <line x1="650" y1="208" x2="1070" y2="208" stroke="#57534b" stroke-width="1.5"/>
  <circle cx="674" cy="189" r="5" stroke="#57534b" stroke-width="1.5"/>
  <circle cx="694" cy="189" r="5" stroke="#57534b" stroke-width="1.5"/>
  <rect x="680" y="236" width="360" height="54" rx="8" stroke="#57534b" stroke-width="2"/>
  <rect x="696" y="258" width="60" height="10" rx="5" fill="#57534b"/>
  <rect x="780" y="258" width="200" height="10" rx="5" fill="#8e887d"/>
  <rect x="680" y="318" width="360" height="54" rx="8" stroke="#57534b" stroke-width="2"/>
  <rect x="696" y="340" width="60" height="10" rx="5" fill="#57534b"/>
  <rect x="780" y="340" width="150" height="10" rx="5" fill="#8e887d"/>
  <rect x="680" y="400" width="360" height="40" rx="8" stroke="#8e887d" stroke-width="1.5" stroke-dasharray="6 6"/>
</svg>
