<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#8e887d"/>
    </pattern>
  </defs>
  <rect x="120" y="90" width="960" height="450" fill="url(#dots)" opacity="0.4"/>

  <!-- timeline axis -->
  <line x1="140" y1="315" x2="1060" y2="315" stroke="#8e887d" stroke-width="2"/>

  <!-- gold: the check that runs before the stream starts -->
  <rect x="150" y="255" width="190" height="120" rx="10" fill="#fbf8f2" stroke="#8f6f2e" stroke-width="4"/>
  <path d="M200 315 L235 348 L290 280" stroke="#8f6f2e" stroke-width="4"/>

  <!-- commit line: headers and status are sent here -->
  <line x1="420" y1="130" x2="420" y2="500" stroke="#1b1a17" stroke-width="3"/>
  <rect x="395" y="120" width="50" height="34" rx="6" fill="#fbf8f2" stroke="#1b1a17" stroke-width="2.5"/>
  <rect x="408" y="133" width="24" height="8" rx="4" fill="#1b1a17"/>

  <!-- streamed chunks after the commit -->
  <rect x="480" y="270" width="150" height="90" rx="8" fill="#fbf8f2" stroke="#57534b" stroke-width="2.5"/>
  <rect x="500" y="294" width="80" height="8" rx="4" fill="#57534b"/>
  <rect x="500" y="318" width="110" height="8" rx="4" fill="#8e887d"/>
  <rect x="680" y="270" width="150" height="90" rx="8" fill="#fbf8f2" stroke="#57534b" stroke-width="2" stroke-opacity="0.8"/>
  <rect x="700" y="294" width="60" height="8" rx="4" fill="#57534b"/>
  <rect x="700" y="318" width="100" height="8" rx="4" fill="#8e887d"/>
  <rect x="880" y="270" width="150" height="90" rx="8" stroke="#8e887d" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- too late: crossed-out check after the commit -->
  <circle cx="955" cy="315" r="16" stroke="#8e887d" stroke-width="2"/>
  <path d="M945 305 L965 325 M965 305 L945 325" stroke="#8e887d" stroke-width="2"/>
</svg>
