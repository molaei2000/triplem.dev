<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#8e887d"/>
    </pattern>
  </defs>
  <rect x="120" y="90" width="960" height="450" fill="url(#dots)" opacity="0.4"/>

  <!-- stack of layers (old code) -->
  <rect x="200" y="400" width="420" height="60" rx="8" fill="#fbf8f2" stroke="#8e887d" stroke-width="2"/>
  <rect x="200" y="320" width="420" height="60" rx="8" fill="#fbf8f2" stroke="#57534b" stroke-width="2"/>
  <rect x="200" y="240" width="420" height="60" rx="8" fill="#fbf8f2" stroke="#57534b" stroke-width="2.5"/>
  <rect x="200" y="160" width="420" height="60" rx="8" fill="#fbf8f2" stroke="#1b1a17" stroke-width="3"/>
  <rect x="226" y="186" width="120" height="8" rx="4" fill="#1b1a17"/>
  <rect x="226" y="266" width="160" height="8" rx="4" fill="#57534b"/>
  <rect x="226" y="346" width="90" height="8" rx="4" fill="#57534b"/>
  <rect x="226" y="426" width="140" height="8" rx="4" fill="#8e887d"/>

  <!-- bugs found deep in old layers -->
  <circle cx="540" cy="430" r="9" stroke="#1b1a17" stroke-width="2.5"/>
  <circle cx="570" cy="350" r="9" stroke="#1b1a17" stroke-width="2.5"/>
  <circle cx="520" cy="270" r="9" stroke="#1b1a17" stroke-width="2.5"/>

  <!-- scanning beam from the right -->
  <path d="M900 315 L660 430 M900 315 L660 350 M900 315 L660 270" stroke="#8e887d" stroke-width="1.5" stroke-dasharray="6 8"/>
  <circle cx="930" cy="315" r="34" stroke="#1b1a17" stroke-width="3"/>
  <circle cx="930" cy="315" r="10" stroke="#57534b" stroke-width="2"/>

  <!-- gold: version upgrade arrow to the safe release -->
  <path d="M760 160 L1000 160" stroke="#8f6f2e" stroke-width="4"/>
  <path d="M970 135 L1000 160 L970 185" stroke="#8f6f2e" stroke-width="4"/>
  <circle cx="760" cy="160" r="8" stroke="#8f6f2e" stroke-width="4"/>
</svg>
