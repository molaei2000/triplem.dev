# Nginx site for triplem.dev: terminates TLS and proxies to the Nuxt container on
# 127.0.0.1:3000. Installed as /etc/nginx/sites-available/triplem.dev by scripts/deploy.sh.
#
# The ZeroSSL certificate is issued by acme.sh and installed into /etc/nginx/ssl/triplem.dev/;
# acme.sh's cron job renews it and reloads Nginx.
#
# ACME challenges use acme.sh's stateless mode: Nginx answers every token with
# "<token>.<account thumbprint>", so there are no challenge files. ZeroSSL keeps re-checking a
# token after acme.sh has given up on its 24 h Retry-After and deleted the webroot file, which
# made webroot validation fail. The thumbprint is public; it changes only if the ZeroSSL account
# key does (`acme.sh --register-account` prints it).
# Nginx 1.24 (Ubuntu 24.04) predates `http2 on;`, hence `listen ... ssl http2`.

upstream triplem_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

ssl_certificate /etc/nginx/ssl/triplem.dev/fullchain.pem;
ssl_certificate_key /etc/nginx/ssl/triplem.dev/key.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:triplem_ssl:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# Plain HTTP: answer ACME challenges, send everything else to the canonical HTTPS host.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name triplem.dev www.triplem.dev _;

    location ~ "^/\.well-known/acme-challenge/([-_a-zA-Z0-9]+)$" {
        default_type text/plain;
        return 200 "$1.H0YCo6-vb6g9rPWlcLuZfHHTLrVzcw1-nK7rskw_Nmc";
    }

    location / {
        return 301 https://triplem.dev$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.triplem.dev;

    return 301 https://triplem.dev$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name triplem.dev;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        include /etc/nginx/snippets/triplem-proxy.conf;
    }
}
