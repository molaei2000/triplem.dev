# Bootstrap Nginx site for triplem.dev: HTTP only, used by scripts/deploy.sh until the
# certificate exists at /etc/nginx/ssl/triplem.dev/. After that, triplem.dev.conf takes over.

upstream triplem_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name triplem.dev www.triplem.dev _;

    # ACME HTTP-01 challenges, stateless (see triplem.dev.conf).
    location ~ "^/\.well-known/acme-challenge/([-_a-zA-Z0-9]+)$" {
        default_type text/plain;
        return 200 "$1.H0YCo6-vb6g9rPWlcLuZfHHTLrVzcw1-nK7rskw_Nmc";
    }

    location / {
        include /etc/nginx/snippets/triplem-proxy.conf;
    }
}
